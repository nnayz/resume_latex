name: Build and Release Resume

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rename file to remove space
        run: mv "My Resume.tex" MyResume.tex

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: MyResume.tex

      - name: Rename PDF back
        run: mv MyResume.pdf "My Resume.pdf"

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: resume-${{ steps.date.outputs.date }}-${{ github.run_number }}
          name: Resume ${{ steps.date.outputs.date }}
          body: |
            Automated resume build from commit ${{ github.sha }}
            
            📄 Download the PDF below.
          files: "My Resume.pdf"
          make_latest: true
