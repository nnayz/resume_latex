name: Build Resume

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rename English resume to remove space
        run: mv "My Resume.tex" MyResume.tex

      - name: Compile English resume
        uses: xu-cheng/latex-action@v3
        with:
          root_file: MyResume.tex

      - name: Compile German Lebenslauf
        uses: xu-cheng/latex-action@v3
        with:
          root_file: German_Lebenslauf.tex

      - name: Copy PDFs to resume-viewer
        run: |
          mkdir -p resume-viewer/public
          cp MyResume.pdf resume-viewer/public/resume.pdf
          cp German_Lebenslauf.pdf resume-viewer/public/lebenslauf.pdf

      - name: Commit and push PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resume-viewer/public/resume.pdf resume-viewer/public/lebenslauf.pdf
          git diff --staged --quiet || git commit -m "chore: update compiled resume PDFs"
          git push
